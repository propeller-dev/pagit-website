<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pagit · Integrations bar</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-sans);}
  .wrap{padding:24px;}
  .label{font-size:12px;color:var(--color-ink-500);text-align:center;margin-bottom:18px;letter-spacing:.01em;}
  .row{display:flex;gap:36px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .row img{height:24px;width:auto;opacity:.85;filter:grayscale(.2);}
  .disclaimer{margin-top:18px;font-size:10px;color:var(--color-ink-400);text-align:center;max-width:560px;margin-left:auto;margin-right:auto;line-height:1.4;}
</style>
</head>
<body>
<div class="wrap">
  <p class="label">Integra com as ferramentas que você conhece</p>
  <div class="row">
    <img src="../assets/integrations/stripe.svg" alt="Stripe">
    <img src="../assets/integrations/woovi.svg" alt="Woovi">
    <img src="../assets/integrations/whatsapp.svg" alt="WhatsApp">
    <img src="../assets/integrations/resend.svg" alt="Resend">
  </div>
  <p class="disclaimer">Marcas de terceiros citadas para fins de integração técnica. Não representam endosso ou parceria comercial oficial.</p>
</div>
</body>
</html>
