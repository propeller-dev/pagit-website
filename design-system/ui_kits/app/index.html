<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pagit · App UI kit</title>
<meta name="viewport" content="width=1440">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html,body{margin:0;background:#F8FAFC;font-family:var(--font-sans);color:var(--color-ink-900);}
  *{box-sizing:border-box;}
  button{font-family:inherit;}
  .shell{height:100vh;display:flex;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:#F8FAFC;overflow:hidden;}
  .scroll{flex:1;overflow:auto;}
  table{font-feature-settings:"tnum" on;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/Primitives.jsx"></script>
<script type="text/babel" src="components/Layout.jsx"></script>
<script type="text/babel" src="components/Screens.jsx"></script>

<script type="text/babel">
  const { useState } = React;
  const { Sidebar, TopBar } = window.PagitAppLayout;
  const { OverviewScreen, ChargesScreen, CustomersScreen, NewChargeScreen } = window.PagitAppScreens;

  const SCREEN_META = {
    overview:  { breadcrumbs: ["Dashboard", "Visão geral"], Screen: OverviewScreen },
    charges:   { breadcrumbs: ["Dashboard", "Cobranças"], Screen: ChargesScreen },
    customers: { breadcrumbs: ["Dashboard", "Clientes"], Screen: CustomersScreen },
    newcharge: { breadcrumbs: ["Dashboard", "Cobranças", "Nova"], Screen: NewChargeScreen },
  };

  function App() {
    const [active, setActive] = useState("overview");
    const meta = SCREEN_META[active] || SCREEN_META.overview;
    const Screen = meta.Screen;
    return (
      <div className="shell">
        <Sidebar active={active.startsWith("newcharge") ? "charges" : active} onNavigate={setActive} />
        <div className="main">
          <TopBar breadcrumbs={meta.breadcrumbs} />
          {/* secondary tab to navigate "Nova cobrança" — visible only on charges screen */}
          {active === "charges" && (
            <div style={{ padding: "12px 24px 0" }}>
              <div style={{ display: "flex", gap: 8, fontSize: 13 }}>
                <button onClick={() => setActive("charges")} style={{ background: "#0B1220", color: "#fff", padding: "6px 12px", borderRadius: 8, border: 0, cursor: "pointer", fontFamily: "inherit", fontWeight: 500 }}>Todas (124)</button>
                <button style={{ background: "transparent", color: "#475569", padding: "6px 12px", borderRadius: 8, border: 0, cursor: "pointer", fontFamily: "inherit" }}>Em aberto (28)</button>
                <button style={{ background: "transparent", color: "#475569", padding: "6px 12px", borderRadius: 8, border: 0, cursor: "pointer", fontFamily: "inherit" }}>Atrasadas (5)</button>
                <button style={{ background: "transparent", color: "#475569", padding: "6px 12px", borderRadius: 8, border: 0, cursor: "pointer", fontFamily: "inherit" }}>Pagas (91)</button>
                <span style={{ marginLeft: "auto" }}>
                  <button onClick={() => setActive("newcharge")} style={{ background: "transparent", color: "#047857", border: 0, fontFamily: "inherit", cursor: "pointer", fontSize: 13 }}>Ver tela de criação →</button>
                </span>
              </div>
            </div>
          )}
          <div className="scroll">
            <Screen />
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
