name: Deploy to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Coolify Webhook
        run: |
          if [ -z "${{ secrets.COOLIFY_WEBHOOK }}" ]; then
            echo "Error: COOLIFY_WEBHOOK secret is not set."
            exit 1
          fi
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK }}"
