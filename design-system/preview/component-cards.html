<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pagit · Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#f8fafc;font-family:var(--font-sans);}
  .wrap{padding:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .card{border-radius:16px;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:120px;}
  .light{background:#fff;border:1px solid var(--color-line-200);box-shadow:var(--shadow-sm);}
  .wash{background:var(--color-brand-50);border:1px solid rgba(209,250,229,.6);}
  .dark{background:var(--color-brand-900);border:1px solid var(--color-brand-800);}
  .outline{background:transparent;border:1px solid var(--color-line-200);}
  .kicker{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-brand-700);}
  .dark .kicker{color:var(--color-brand-300);}
  .outline .kicker{color:var(--color-ink-500);}
  .title{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:-0.025em;color:var(--color-ink-900);}
  .dark .title{color:#fff;}
  .body{font-size:12px;color:var(--color-ink-600);line-height:1.4;}
  .dark .body{color:rgba(209,250,229,.8);}
</style>
</head>
<body>
<div class="wrap">
  <div class="card light">
    <div class="kicker">Light</div>
    <div class="title">Card padrão</div>
    <div class="body">Fundo branco, borda sutil, sombra-sm.</div>
  </div>
  <div class="card wash">
    <div class="kicker">Wash</div>
    <div class="title">Card emerald</div>
    <div class="body">Fundo brand/50, sem borda forte.</div>
  </div>
  <div class="card dark">
    <div class="kicker">Dark</div>
    <div class="title">Card escuro</div>
    <div class="body">Fundo brand/900, texto branco.</div>
  </div>
  <div class="card outline">
    <div class="kicker">Outline</div>
    <div class="title">Card outline</div>
    <div class="body">Sem fundo, só borda.</div>
  </div>
</div>
</body>
</html>
