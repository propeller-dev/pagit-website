<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pagit · Display type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--color-surface);}
  .wrap{padding:26px;display:flex;flex-direction:column;gap:18px;}
  .lbl{font-size:10px;color:var(--color-ink-500);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-family:var(--font-sans);}
  .specimen{font-family:var(--font-display);color:var(--color-ink-900);}
  .gradient{background:linear-gradient(90deg,#047857,#10b981);-webkit-background-clip:text;background-clip:text;color:transparent;}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="lbl">Display · Unbounded 800 · 72/76 · −0.04em</div>
    <div class="specimen" style="font-size:56px;line-height:1.05;font-weight:800;letter-spacing:-0.04em">
      Receber em dia virou<br>
      <span class="gradient">a parte chata.</span>
    </div>
  </div>
  <div>
    <div class="lbl">H2 · Unbounded 700 · 40/48 · −0.03em</div>
    <div class="specimen" style="font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-0.03em">Tira-dúvidas honesto.</div>
  </div>
  <div>
    <div class="lbl">H3 · Unbounded 700 · 24/32 · −0.025em</div>
    <div class="specimen" style="font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-0.025em">Cobrança recorrente no Pix</div>
  </div>
</div>
</body>
</html>
