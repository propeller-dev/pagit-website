<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pagit · Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--color-surface);font-family:var(--font-sans);}
  .wrap{padding:22px;}
  table{border-collapse:collapse;width:100%;}
  td{padding:6px 12px 6px 0;vertical-align:baseline;}
  .name{font-size:11px;color:var(--color-ink-500);font-family:var(--font-mono);width:80px;}
  .px{font-size:11px;color:var(--color-ink-400);font-family:var(--font-mono);width:120px;}
  .sample{color:var(--color-ink-900);}
  .display .sample{font-family:var(--font-display);font-weight:700;letter-spacing:-0.03em;}
</style>
</head>
<body>
<div class="wrap">
  <table class="display">
    <tr><td class="name">6xl</td><td class="px">72 / 75 · −0.04em</td><td class="sample" style="font-size:48px;line-height:1.05;font-weight:800;letter-spacing:-0.04em">Pagit</td></tr>
    <tr><td class="name">5xl</td><td class="px">56 / 62</td><td class="sample" style="font-size:38px;line-height:1.05;font-weight:700">Receber</td></tr>
    <tr><td class="name">4xl</td><td class="px">40 / 48</td><td class="sample" style="font-size:30px;line-height:1.1;font-weight:700">Seções</td></tr>
    <tr><td class="name">3xl</td><td class="px">32 / 38</td><td class="sample" style="font-size:24px;line-height:1.15;font-weight:700">Sub-seções</td></tr>
    <tr><td class="name">2xl</td><td class="px">24 / 32</td><td class="sample" style="font-size:20px;line-height:1.25;font-weight:700">Card titles</td></tr>
  </table>
  <table style="margin-top:14px">
    <tr><td class="name">xl</td><td class="px">20 / 28</td><td class="sample" style="font-size:18px;line-height:1.45">Lead paragraph</td></tr>
    <tr><td class="name">lg</td><td class="px">18 / 28</td><td class="sample" style="font-size:16px;line-height:1.5">Hero subtitle</td></tr>
    <tr><td class="name">base</td><td class="px">16 / 24</td><td class="sample" style="font-size:14px;line-height:1.5">Body default</td></tr>
    <tr><td class="name">sm</td><td class="px">14 / 20</td><td class="sample" style="font-size:13px;line-height:1.45;color:var(--color-ink-600)">Labels &amp; secondary</td></tr>
    <tr><td class="name">xs</td><td class="px">12 / 16</td><td class="sample" style="font-size:11px;line-height:1.4;color:var(--color-ink-500)">Microcopy &amp; eyebrows</td></tr>
  </table>
</div>
</body>
</html>
