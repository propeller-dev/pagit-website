<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pagit · Website UI kit</title>
<meta name="viewport" content="width=1320">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-sans);color:var(--color-ink-900);}
  *{box-sizing:border-box;}
  a{color:inherit;}
  /* nav underline hover */
  .navlink::after{content:"";position:absolute;left:0;bottom:-6px;height:2px;background:#059669;width:100%;transform:scaleX(0);transform-origin:left;transition:transform 200ms cubic-bezier(0.22,1,0.36,1);border-radius:2px;}
  .navlink:hover{color:#047857;}
  .navlink:hover::after{transform:scaleX(1);}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/Primitives.jsx"></script>
<script type="text/babel" src="components/Sections.jsx"></script>
<script type="text/babel" src="components/SectionsBottom.jsx"></script>

<script type="text/babel">
  const { Header, Hero, Integrations, Features, Audience } = window.PagitWebSections1;
  const { HowItWorks, Pricing, FAQ, CtaFinal, Footer } = window.PagitWebSections2;

  function App() {
    return (
      <>
        <Header />
        <main>
          <Hero />
          <Integrations />
          <Features />
          <Audience />
          <HowItWorks />
          <Pricing />
          <FAQ />
          <CtaFinal />
        </main>
        <Footer />
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
