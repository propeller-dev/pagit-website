<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pagit · Shadow scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#f8fafc;font-family:var(--font-sans);}
  .wrap{padding:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
  .card{background:#fff;height:80px;border-radius:14px;border:1px solid rgba(0,0,0,.03);display:flex;align-items:flex-end;justify-content:center;padding:8px;font-size:11px;color:var(--color-ink-600);font-family:var(--font-mono);}
  .lbl{font-size:10px;color:var(--color-ink-500);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:8px;text-align:center;font-family:var(--font-sans);}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="card" style="box-shadow:0 1px 2px 0 rgb(11 18 32 / 0.04)">sm</div>
    <div class="lbl">card resting</div>
  </div>
  <div>
    <div class="card" style="box-shadow:0 4px 12px -2px rgb(11 18 32 / 0.06), 0 2px 4px -2px rgb(11 18 32 / 0.04)">md</div>
    <div class="lbl">button + hover</div>
  </div>
  <div>
    <div class="card" style="box-shadow:0 18px 48px -12px rgb(11 18 32 / 0.12), 0 6px 16px -6px rgb(11 18 32 / 0.08)">lg</div>
    <div class="lbl">pricing focal</div>
  </div>
  <div>
    <div class="card" style="box-shadow:0 30px 60px -20px rgb(2 44 34 / 0.40); background:#022c22;color:#6ee7b7;border-color:#065f46">dark-hero</div>
    <div class="lbl">dark hero panel</div>
  </div>
</div>
</body>
</html>
