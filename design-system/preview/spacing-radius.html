<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pagit · Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--color-surface);font-family:var(--font-sans);}
  .wrap{padding:22px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;}
  .swatch{background:var(--color-brand-50);border:1px solid var(--color-brand-100);height:80px;display:flex;align-items:flex-end;justify-content:center;padding:8px 0;font-size:11px;color:var(--color-brand-800);font-weight:600;}
  .name{font-size:10px;color:var(--color-ink-500);font-family:var(--font-mono);margin-top:6px;text-align:center;letter-spacing:.04em;}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="swatch" style="border-radius:8px">8 / sm</div>
    <div class="name">--radius-sm</div>
  </div>
  <div>
    <div class="swatch" style="border-radius:12px">12 / md</div>
    <div class="name">--radius-md<br>button · input</div>
  </div>
  <div>
    <div class="swatch" style="border-radius:16px">16 / lg</div>
    <div class="name">--radius-lg<br>card</div>
  </div>
  <div>
    <div class="swatch" style="border-radius:24px">24 / xl</div>
    <div class="name">--radius-xl</div>
  </div>
  <div>
    <div class="swatch" style="border-radius:32px">32 / 2xl</div>
    <div class="name">--radius-2xl<br>KPI tile</div>
  </div>
  <div>
    <div class="swatch" style="border-radius:9999px">pill</div>
    <div class="name">--radius-pill<br>badge</div>
  </div>
</div>
</body>
</html>
